spring.application.name=AutoEscola3ESS
server.port=8080

# Banco de dados
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/autoescola3ess?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:fiap}

# Paginacao
spring.data.web.pageable.serialization-mode=via_dto
spring.jpa.open-in-view=false

# Seguranca
api.security.token.secret=${JWT_SECRET:12345678}

# CORS
api.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:4200,http://localhost:5173,http://localhost:5500,http://127.0.0.1:5500,https://*.autoescola3ess.com.br}

# API externa (ViaCEP)
api.externa.viacep.url=https://viacep.com.br/ws
api.externa.timeout-segundos=5

# Documentacao (Swagger / OpenAPI)
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.persist-authorization=true
springdoc.swagger-ui.display-request-duration=true

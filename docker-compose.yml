# Banco MySQL para executar a API localmente (opcional, caso não tenha o MySQL instalado)
# Uso: docker compose up -d
services:
  mysql:
    image: mysql:8.4
    container_name: autoescola3ess-mysql
    environment:
      MYSQL_ROOT_PASSWORD: fiap
      MYSQL_DATABASE: autoescola3ess
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data:
